[workspace]
resolver = "2"
members = [
    "crates/lossy-dsp",
    "crates/lossy-python",
    "crates/shared-dsp",
    "crates/lossy-plugin",
    "crates/fractal-dsp",
    "crates/fractal-python",
    "crates/fractal-plugin",
    "crates/reverb-dsp",
    "crates/reverb-python",
    "crates/reverb-plugin",
    "crates/explore-dsp",
    "crates/explore-cli",
    "crates/claudewire",
    "crates/claudesdk",
    "crates/pedal-chat",
    "crates/sound-designer",
    "crates/preset-export",
    "crates/audio-engine",
    "crates/shared-gui",
    "crates/reverb-app",
    "crates/lossy-app",
    "crates/fractal-app",
    "xtask",
]

[workspace.package]
edition = "2024"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "process", "macros", "sync", "time"] }
anyhow = "1"
tracing = "0.1"
nix = { version = "0.29", features = ["signal"] }
realfft = "3.5"
num-complex = "0.4"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
rosc = "0.11"
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["standalone"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_vizia = { git = "https://github.com/robbert-vdh/nih-plug.git" }
cpal = "0.15"
rubato = "0.15"
rfd = "0.15"
crossbeam-channel = "0.5"

[patch."https://github.com/robbert-vdh/nih-plug.git"]
nih_plug = { path = "patches/nih-plug" }
nih_plug_egui = { path = "patches/nih-plug/nih_plug_egui" }
nih_plug_vizia = { path = "patches/nih-plug/nih_plug_vizia" }
nih_plug_xtask = { path = "patches/nih-plug/nih_plug_xtask" }

[patch."https://github.com/RustAudio/baseview.git"]
baseview = { path = "patches/baseview" }
