[package]
name = "fractal-app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fractal-app"
path = "src/main.rs"

[dependencies]
fractal-dsp = { path = "../fractal-dsp" }
shared-gui = { path = "../shared-gui" }
audio-engine = { path = "../audio-engine" }
vizia = { git = "https://github.com/vizia/vizia.git", branch = "main", default-features = false, features = ["winit", "clipboard"] }
serde.workspace = true
serde_json.workspace = true
rfd.workspace = true
crossbeam-channel.workspace = true
