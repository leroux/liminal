[package]
name = "fractal-plugin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "fractal-standalone"
path = "src/main.rs"

[dependencies]
fractal-dsp = { path = "../fractal-dsp" }
shared-dsp = { path = "../shared-dsp" }
nih_plug.workspace = true
nih_plug_vizia.workspace = true
serde_json.workspace = true
claudewire = { path = "../claudewire" }
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24.0"
objc = "0.2.7"
