[package]
name = "claudewire"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "process", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
nix = { version = "0.29", features = ["signal"] }
